<div class="modal-panel">
  <h2>Add a new task</h2>
  <p class="sub">Pick a group, set the deadline, and you're done.</p>

  <div class="field">
    <label>Task title</label>
    <div class="title-wrap">
      <input [(ngModel)]="task.title" maxlength="120" type="text" placeholder="e.g. Study Chapter 3">
      <span>{{ task.title.length }}/120</span>
    </div>
  </div>

  <div class="field">
    <label>Description & Specifications</label>
    <textarea [(ngModel)]="task.description" placeholder="Task details"></textarea>
  </div>

  <div class="field">
    <label>Assign to Group / Category</label>
    
    @if (!showAddGroup) {
      <div class="chip-row">
        <button type="button" class="chip" *ngFor="let group of groups"
          [class.selected]="task.groupId === group.id"
          [style.--chip-color]="group.color"
          (click)="task.groupId = group.id">
          <span class="dot" [style.background]="group.color"></span>{{ group.name }}
        </button>
        
        <!-- زر إضافة جروب جديد -->
        <button type="button" class="chip add-new-chip" (click)="showAddGroup = true">
          <i class="bi bi-plus-circle-fill"></i> Add New Group
        </button>
      </div>
    }
    
    @if (showAddGroup) {
      <div class="add-group-form">
        <div class="form-header">
          <h4>Create New Group</h4>
          <button type="button" class="close-btn" (click)="cancelAddGroup()">
            <i class="bi bi-x-lg"></i>
          </button>
        </div>
        
        <div class="form-field">
          <label>Group Name</label>
          <input 
            [(ngModel)]="newGroupName" 
            type="text" 
            placeholder="e.g., Mathematics, Project X"
            maxlength="30"
            class="form-input">
        </div>
        
        <div class="form-field">
          <label>Choose Color</label>
          <div class="color-picker">
            <button 
              type="button" 
              *ngFor="let color of colorOptions"
              class="color-option"
              [class.selected]="newGroupColor === color"
              [style.background-color]="color"
              (click)="newGroupColor = color">
              @if (newGroupColor === color) {
                <i class="bi bi-check2"></i>
              }
            </button>
          </div>
        </div>
        
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" (click)="cancelAddGroup()">Cancel</button>
          <button type="button" class="btn btn-primary" (click)="addNewGroup()" [disabled]="!newGroupName.trim()">
            <i class="bi bi-check-lg"></i> Create Group
          </button>
        </div>
      </div>
    }
  </div>

  <div class="row-2">
    <div class="field"><label>Start</label><input [(ngModel)]="task.start" type="datetime-local"></div>
    <div class="field"><label>Deadline</label><input [(ngModel)]="task.end" type="datetime-local"></div>
  </div>

  <div class="field">
    <label>Priority Level</label>
    <div class="priority-row">
      <button *ngFor="let p of priorities" type="button"
        [class.selected]="task.priority === p" (click)="task.priority = p">{{ p }}</button>
    </div>
  </div>

  <div class="modal-actions">
    <button class="btn btn-ghost" type="button" (click)="goBack()">Cancel</button>
    <button class="btn btn-primary" type="button" (click)="createTask()">Create Task</button>
  </div>
</div>
