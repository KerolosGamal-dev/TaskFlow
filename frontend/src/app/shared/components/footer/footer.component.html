<footer class="footer">
  <div class="footer-container">
    <!-- Top Section -->
    <div class="footer-top">
      <!-- Brand Section -->
      <div class="footer-brand">
        <div class="footer-logo">
          <i class="bi bi-kanban-fill logo-icon"></i>
          <span class="logo-text">Task Flow</span>
        </div>
        <p class="tagline">{{ translate('footerTagline') }}</p>
        <div class="social-links">
          <span class="social-title">{{ translate('socialFollow') }}</span>
          <div class="social-icons">
            <a *ngFor="let social of socialLinks" 
               [href]="social.url" 
               class="social-icon" 
               [title]="social.name"
               target="_blank">
              <i class="bi" [class]="social.icon"></i>
            </a>
          </div>
        </div>
      </div>

      <!-- Quick Links -->
      <div class="footer-section">
        <h4>{{ translate('quickLinks') }}</h4>
        <ul class="footer-links">
          <li *ngFor="let link of quickLinks">
            <a [routerLink]="link.route">{{ translate(link.label) }}</a>
          </li>
        </ul>
      </div>

      <!-- Contact -->
      <div class="footer-section">
        <h4>{{ translate('contactUs') }}</h4>
        <ul class="footer-contact">
          <li><i class="bi bi-envelope-fill"></i> support@taskflow.com</li>
          <li><i class="bi bi-phone-fill"></i> +20 123 456 7890</li>
          <li><i class="bi bi-geo-alt-fill"></i> NTI, Egypt</li>
        </ul>
      </div>
    </div>

    <!-- Bottom Section -->
    <div class="footer-bottom">
      <div class="footer-credit">
        <p>{{ translate('footerCredit') }}</p>
      </div>
      <div class="footer-rights">
        <p>{{ translate('footerRights') }}</p>
      </div>
    </div>
  </div>
</footer>
